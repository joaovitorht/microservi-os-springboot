spring.application.name=hr-oauth
server.port=${PORT:0}

eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.security.oauth2.authorizationserver.client.hr-client.registration.client-id=hr-client
spring.security.oauth2.authorizationserver.client.hr-client.registration.client-secret={noop}hr-secret
spring.security.oauth2.authorizationserver.client.hr-client.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.hr-client.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.hr-client.registration.authorization-grant-types[1]=refresh_token
spring.security.oauth2.authorizationserver.client.hr-client.registration.redirect-uris[0]=https://oauth.pstmn.io/v1/callback
spring.security.oauth2.authorizationserver.client.hr-client.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.hr-client.registration.scopes[1]=read
spring.security.oauth2.authorizationserver.client.hr-client.registration.scopes[2]=write
spring.security.oauth2.authorizationserver.client.hr-client.require-authorization-consent=true
